[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jevlet"
version = "0.1.0"
description = "Tiny Jev-inspired calibrated decision-model research platform"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.8"]
pretrained = ["transformers>=4.46"]
semantic = ["sentence-transformers>=3.0"]
desktop = ["Pillow>=10", "pywinauto>=0.6.8"]
colab = ["datasets>=3.0", "huggingface-hub>=0.24", "nbformat>=5"]

[tool.setuptools.packages.find]
include = ["jevlet*", "research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# One case or skill per line keeps hand-written tables reviewable.
"jevlet/benchmarks.py" = ["E501"]
"jevlet/assistant/skills.py" = ["E501"]
"jevlet/assistant/commands_synthetic.py" = ["E501"]
"jevlet/assistant/benchmark.py" = ["E501"]
"jevlet/grounding_synthetic.py" = ["E501"]
"jevlet/grounding_live.py" = ["E501"]
"jevlet/assistant/commands_v5.py" = ["E501"]
"jevlet/assistant/benchmark_v2.py" = ["E501"]
"jevlet/assistant/lexicon.py" = ["E501"]
"jevlet/assistant/augment.py" = ["E501"]
"jevlet/assistant/real_commands.py" = ["E501"]
"jevlet/model_card.py" = ["E501"]
"scripts/make_colab_notebook.py" = ["E501"]
"scripts/export_onnx.py" = ["E501"]

[tool.ruff.format]
exclude = ["jevlet/benchmarks.py", "jevlet/assistant/skills.py", "jevlet/assistant/commands_synthetic.py", "jevlet/assistant/benchmark.py", "jevlet/grounding_synthetic.py", "jevlet/assistant/commands_v5.py", "jevlet/assistant/benchmark_v2.py", "jevlet/assistant/lexicon.py", "jevlet/assistant/augment.py", "jevlet/assistant/real_commands.py"]
